openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Collaborative to-do lists, membership, invitations, and tasks.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    List:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }
    ListMember:
      type: object
      required: [id, listId, userId, email, role, joinedAt]
      properties:
        id: { type: string }
        listId: { type: string }
        userId: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, member] }
        joinedAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, listId, invitedEmail, invitedBy, status, createdAt]
      properties:
        id: { type: string }
        listId: { type: string }
        invitedEmail: { type: string, format: email }
        invitedBy: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        createdAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, listId, title, priority, done, createdBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        listId: { type: string }
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        done: { type: boolean }
        createdBy: { type: string }
        completedBy: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [title, priority]
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
    TaskUpdate:
      type: object
      properties:
        title: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [low, medium, high] }
        done: { type: boolean }
  responses:
    NotFound:
      description: resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: caller may not perform this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
security:
  - bearerAuth: []
paths:
  /lists:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listLists
      summary: List the caller's lists (owned or joined)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: page of lists
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/List' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createList
      summary: Create a new shared to-do list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: list created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getList
      summary: Get a list by id
      responses:
        '200':
          description: the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteList
      summary: Delete a list (owner only)
      responses:
        '204': { description: list deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lists/{listId}/members:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMembers
      summary: List a list's members
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: page of members
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/ListMember' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lists/{listId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/MemberId'
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: removeMember
      summary: Remove a member from a list (owner only)
      responses:
        '204': { description: member removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lists/{listId}/leave:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: leaveList
      summary: Leave a shared list the caller belongs to
      responses:
        '204': { description: left the list }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lists/{listId}/invitations:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listListInvitations
      summary: List pending invitations for a list (owner only)
      responses:
        '200':
          description: pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createInvitation
      summary: Invite someone to a list by email (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitedEmail]
              properties:
                invitedEmail: { type: string, format: email }
      responses:
        '201':
          description: invitation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /invitations:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listMyInvitations
      summary: List pending invitations addressed to the caller's account email
      responses:
        '200':
          description: pending invitations
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /invitations/{invitationId}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: acceptInvitation
      summary: Accept an invitation addressed to the caller, joining the list
      responses:
        '200':
          description: membership created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /invitations/{invitationId}/decline:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: declineInvitation
      summary: Decline an invitation addressed to the caller
      responses:
        '204': { description: invitation declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lists/{listId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTasks
      summary: List tasks on a list, sortable/filterable by due date or priority
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: sort
          in: query
          schema: { type: string, enum: [dueDate, priority] }
        - name: priority
          in: query
          schema: { type: string, enum: [low, medium, high] }
        - name: done
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data: { type: array, items: { $ref: '#/components/schemas/Task' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createTask
      summary: Add a task to a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: task created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateTask
      summary: Edit a task, or toggle its done state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
      responses:
        '200':
          description: task updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTask
      summary: Delete a task
      responses:
        '204': { description: task deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
